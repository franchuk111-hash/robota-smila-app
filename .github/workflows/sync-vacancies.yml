name: Refresh verified vacancy facts

on:
  push:
    branches: [main]
    paths-ignore:
      - "reports/**"
      - "**.md"
  schedule:
    - cron: "17 5-20/3 * * *"
  workflow_dispatch:

concurrency:
  group: robota-smila-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # A manual run or a queued schedule must never deploy its old trigger SHA.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require production publishing credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Back up the exact source and vacancy data before refresh
        run: |
          mkdir -p "$RUNNER_TEMP/robota-release" reports
          git rev-parse HEAD > "$RUNNER_TEMP/robota-release/source-before.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/robota-release/source-before.tar.gz" HEAD
          cp data/collected-vacancies.json "$RUNNER_TEMP/robota-release/vacancies-before.json"
      - run: npm ci
      - name: Check approved release features before changing data
        run: |
          node scripts/release-guard.mjs
          cp data/collected-vacancies.json "$RUNNER_TEMP/robota-release/vacancies-before.json"
      - name: Refresh existing vacancy facts without Telegram messages
        run: npm run vacancies:sync -- --facts-only
      - name: Register source pages for new Telegram vacancy links
        run: node --import tsx scripts/update-telegram-source-pages.ts
      - name: Reject vacancy loss or changed Telegram post references
        run: node scripts/release-guard.mjs --baseline "$RUNNER_TEMP/robota-release/vacancies-before.json"
      - name: Test the refreshed release before saving or publishing
        run: |
          npm run typecheck
          npm test
      - name: Save verified vacancy facts for the website
        run: |
          if git diff --quiet -- data/collected-vacancies.json lib/telegram-source-pages.json; then exit 0; fi
          git config user.name "robota-smila-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/collected-vacancies.json lib/telegram-source-pages.json
          git commit -F - <<'MSG'
          Keep existing vacancy facts aligned with verified sources

          Refresh dates and pay only when source identity and content agree.
          Preserve all historical records and existing Telegram post links.

          Constraint: Preserve existing vacancies and Telegram post references
          Confidence: high
          Scope-risk: narrow
          Tested: release guard before and after vacancy collection
          MSG
          git push
      - name: Deploy the site so the new vacancy dates go live
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          export ROBOTA_RELEASE_SHA="$(git rev-parse HEAD)"
          printf 'ROBOTA_RELEASE_SHA=%s\n' "$ROBOTA_RELEASE_SHA" >> "$GITHUB_ENV"
          printf '%s\n' "$ROBOTA_RELEASE_SHA" > "$RUNNER_TEMP/robota-release/source-published.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/robota-release/source-published.tar.gz" HEAD
          cp data/collected-vacancies.json "$RUNNER_TEMP/robota-release/vacancies-published.json"
          npx opennextjs-cloudflare build 2>&1 | tee "$RUNNER_TEMP/robota-release/build.log"
          node scripts/release-guard.mjs --built --baseline "$RUNNER_TEMP/robota-release/vacancies-before.json"
          # Fail closed if another release advanced the source during this build.
          git fetch origin "${{ github.event.repository.default_branch }}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          # Keep OAuth and other runtime variables configured outside the repository.
          npx wrangler deployments list > "$RUNNER_TEMP/robota-release/deployments-before.txt"
          npx wrangler deploy --keep-vars 2>&1 | tee "$RUNNER_TEMP/robota-release/deploy.log"
      - name: Verify published vacancy facts and protected routes
        run: |
          node --import tsx scripts/prepublish-smoke.ts https://robota-smila.com.ua --live
          node --import tsx scripts/check-live-vacancy-parity.mjs
      - name: Configure durable approved vacancy delivery
        run: |
          git config user.name "robota-smila-bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Publish newly approved live vacancies to the group and four channels
        id: telegram_queue
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          before="$(git rev-parse HEAD)"
          node --import tsx scripts/publish-approved-vacancies.ts
          if [ "$before" != "$(git rev-parse HEAD)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish confirmed Telegram links after successful delivery
        if: steps.telegram_queue.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          export ROBOTA_RELEASE_SHA="$(git rev-parse HEAD)"
          printf 'ROBOTA_RELEASE_SHA=%s\n' "$ROBOTA_RELEASE_SHA" >> "$GITHUB_ENV"
          printf '%s\n' "$ROBOTA_RELEASE_SHA" > "$RUNNER_TEMP/robota-release/source-published.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/robota-release/source-published.tar.gz" HEAD
          npx opennextjs-cloudflare build 2>&1 | tee "$RUNNER_TEMP/robota-release/telegram-links-build.log"
          node scripts/release-guard.mjs --built --baseline "$RUNNER_TEMP/robota-release/vacancies-before.json"
          git fetch origin "${{ github.event.repository.default_branch }}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          npx wrangler deploy --keep-vars 2>&1 | tee "$RUNNER_TEMP/robota-release/telegram-links-deploy.log"
          node --import tsx scripts/prepublish-smoke.ts https://robota-smila.com.ua --live
          node --import tsx scripts/check-live-vacancy-parity.mjs
      - name: Preserve release evidence and rollback source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robota-release-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/robota-release/
            reports/live-smoke.json
            reports/telegram-live-inventory.json
            reports/live-vacancy-parity.json
            reports/approved-telegram-publication.json
            data/telegram-primary-posts.json
            data/telegram-mirror-posts.json
            data/manual-vacancies.json
